<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hoodie World</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=3">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="brand-half">
        <span class="brand-logo" aria-label="Hoodie World">HW</span>
      </div>

      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="main-menu" aria-label="Open menu">
        <svg class="icon icon-open" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M3 6h18M3 12h18M3 18h18" />
        </svg>
        <svg class="icon icon-close" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M6 6l12 12M18 6L6 18" />
        </svg>
      </button>

      <nav class="main-nav" aria-label="Main navigation">
        <ul id="main-menu" class="nav-list">
          <li><a class="nav-link" href="#who-we-are">Who we are</a></li>
          <li><a class="nav-link" href="#collection">See Our Collection</a></li>
          <li><a class="nav-link" href="#contact-us">Contact us</a></li>
          <li>
            <button class="icon-button" type="button" aria-label="Cart, 0 items">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M3 4h2l2.4 11.2a1.5 1.5 0 0 0 1.5 1.2h8.7a1.5 1.5 0 0 0 1.5-1.1L21 8H6.2" />
                <circle cx="9.5" cy="20" r="1.3" />
                <circle cx="17.5" cy="20" r="1.3" />
              </svg>
              <span class="badge" aria-hidden="true">0</span>
            </button>
          </li>
          <li>
            <button class="icon-button" type="button" aria-label="Favorites, 0 items">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M12 20.3l-1.2-1.1C6.1 15 3 12.2 3 8.8 3 6 5.2 3.8 8 3.8c1.6 0 3.1.7 4 1.9.9-1.2 2.4-1.9 4-1.9 2.8 0 5 2.2 5 5 0 3.4-3.1 6.2-7.8 10.4L12 20.3z" />
              </svg>
              <span class="badge" aria-hidden="true">0</span>
            </button>
          </li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="promo-bar">
        <p class="promo-text">Use NewChicOne to get 10% discount for your first purchase!</p>
      </div>
      <a class="btn-primary" href="#collection">Buy now</a>
    </section>

    <section id="who-we-are" class="placeholder-section" aria-labelledby="who-we-are-title">
      <h2 id="who-we-are-title">Who we are</h2>
    </section>

    <section id="collection" class="placeholder-section" aria-labelledby="collection-title">
      <h2 id="collection-title">Collection</h2>
    </section>

    <section id="contact-us" class="placeholder-section" aria-labelledby="contact-us-title">
      <h2 id="contact-us-title">Contact us</h2>
    </section>
  </main>

  <script src="script.js?v=3"></script>
</body>
</html>
